<script>
const snapshot=JSON.parse(document.getElementById('olympus-data').textContent);
const records=snapshot.records;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=new Map(records.map(r=>[r.id,r]));

function formatTime(value){const date=new Date(value);return value&&!Number.isNaN(date.valueOf())?date.toLocaleString():'Unknown';}
function linkedIds(id){const seen=new Set(),pending=[id];while(pending.length){const next=pending.pop();if(seen.has(next)||!byId.has(next))continue;seen.add(next);pending.push(...(byId.get(next).links||[]));}return seen;}
function filtered(){const query=$('search').value.trim().toLowerCase(),ids=selected?linkedIds(selected):null;return records.filter(r=>(query||!ids||ids.has(r.id))&&(!query||[r.id,r.title,r.request,r.statusRaw,r.source,...r.agents.flat()].join(' ').toLowerCase().includes(query))&&(!$('status-filter').value||r.status===$('status-filter').value)&&(!$('stage-filter').value||r.stage===$('stage-filter').value)&&(!attention||r.needs));}
function focusMain(){$('main').focus({preventScroll:true});$('main').scrollTop=0;if(matchMedia('(max-width:780px)').matches)window.scrollTo(0,0);}
function selectGoal(id){selected=id;attention=false;selectedTask=null;$('search').value='';$('status-filter').value='';$('stage-filter').value='';$('goal-filter').value=id;render();$('sidebar').classList.remove('mobile-open');$('nav-toggle').setAttribute('aria-expanded','false');focusMain();}
function abbreviation(r,index){const words=r.title.split(/[^a-zA-Z0-9]+/).filter(Boolean);return words.length>1?words.slice(0,2).map(w=>w[0]).join('').toUpperCase():(words[0]||String(index+1)).slice(0,2).toUpperCase();}
function renderNav(){const query=$('search').value.trim();$('navigation').innerHTML=`<button type="button" class="goal-button" data-select="" data-tooltip="All goals" title="All goals" aria-label="All goals" ${!selected||query?'aria-current="page"':''}><span class="goal-abbr">All</span></button>`+records.map((r,index)=>`<div class="nav-goal"><button type="button" class="goal-button" data-select="${esc(r.id)}" data-tooltip="${esc(r.title)}" title="${esc(r.title)}" aria-label="${esc(r.title)}" ${!query&&selected===r.id?'aria-current="page"':''}><span class="goal-abbr">${esc(abbreviation(r,index))}</span>${r.needs?'<span class="badge" aria-label="Needs your decision">!</span>':''}</button></div>`).join('');$('goal-count').textContent=records.length;$('attention-total').textContent=`${records.filter(r=>r.needs).length} need you`;}
function card(r){return `<article class="card ${r.needs?'needs ':''}${selectedTask===r.id?'selected':''}" data-task="${esc(r.id)}" tabindex="0" role="button" aria-pressed="${selectedTask===r.id}" aria-label="Open details for ${esc(r.title)}"><div class="card-top"><span class="record-id">${esc(r.id)}</span><span class="state ${r.needs?'attention':''}">${r.needs?'Needs you':esc(r.status)}</span></div><h3>${esc(r.title)}</h3><p class="card-note">${esc(r.status==='Unknown'?'Recorded status: '+(r.statusRaw||'not supplied'):r.request||'No goal description recorded.')}</p><div class="card-bottom"><span class="roles">${r.agents.length?`${r.agents.length} recorded roles`:'Roles unknown'}</span><span class="open-label">Open details ↗</span></div></article>`;}
function renderDetail(r){document.querySelector('.app').classList.toggle('detail-closed',!r);$('detail-panel').hidden=!r;if(!r)return;$('detail-content').innerHTML=`<h2>${esc(r.title)}</h2><p class="detail-id">${esc(r.id)} · <span class="detail-status">${esc(r.status)}</span></p>${r.needs?'<p class="decision-notice">Owner decision recorded as pending</p>':''}<dl class="detail-facts"><div><dt>Status</dt><dd>${esc(r.statusRaw||'Unknown')}</dd></div><div><dt>Stage</dt><dd>${esc(r.stage)}${r.stage==='Unknown'?' (not explicitly recorded)':''}</dd></div><div><dt>Source</dt><dd>${esc(r.source)}</dd></div><div><dt>File modified</dt><dd>${esc(formatTime(r.modifiedAt))}</dd></div></dl><section class="detail-section"><h3>Goal and scope</h3><p>${esc(r.request||'Not recorded')}</p></section>${r.decisions.length?`<section class="detail-section"><h3>Recorded owner decisions</h3>${r.decisions.map(d=>`<div class="record-decision"><strong>${esc(d.decision)}</strong><p>${esc(d.response||'Response unknown')}</p><p>${esc(d.effect||'')}</p></div>`).join('')}</section>`:''}<section class="detail-section"><h3>Recorded role participation</h3><p class="detail-limit">Participation is not live agent activity.</p>${r.agents.length?`<ul>${r.agents.map(([role,state])=>`<li>${esc(role)} · ${esc(state)}</li>`).join('')}</ul>`:'<p>No structured role results recorded.</p>'}</section><section class="detail-section"><h3>Linked goals</h3><p>${esc((r.links||[]).join(', ')||'No explicit member links recorded.')}</p></section><details class="raw-source"><summary>Read source record</summary><p class="detail-limit">Plain text as captured. Links and instructions are not executed.</p><pre>${esc(r.raw||'Source unavailable')}</pre></details>`;}
function openDetail(id){if(!byId.has(id))return;selectedTask=id;lastCardId=id;render();$('detail-close').focus({preventScroll:true});if(matchMedia('(max-width:1150px)').matches)$('detail-panel').scrollIntoView({block:'start'});}
function closeDetail(){const id=lastCardId||selectedTask;selectedTask=null;render();const target=[...document.querySelectorAll('[data-task]')].find(el=>el.dataset.task===id);(target||$('main')).focus({preventScroll:true});if(target&&matchMedia('(max-width:1150px)').matches)target.scrollIntoView({block:'center'});}
function resetView(){attention=false;selectedTask=null;$('search').value='';$('status-filter').value='';$('stage-filter').value='';render();$('search').focus();}
function render(){renderNav();const query=$('search').value.trim(),visible=filtered(),closed=visible.filter(r=>['Complete','Cancelled'].includes(r.status)),current=visible.filter(r=>!['Complete','Cancelled'].includes(r.status));if(selectedTask&&!visible.some(r=>r.id===selectedTask))selectedTask=null;const goal=byId.get(selected);$('title').textContent=query?'Search results':attention?'Needs your attention':goal?.title||'Recorded work';$('crumb').textContent=query||!goal?'All goals':goal.title;$('description').textContent=query?`Matches across all goals for “${query}”.`:goal?goal.request||'No goal description recorded.':`Task records from ${snapshot.project}. Stages and status reflect only explicit recorded values.`;$('overview').innerHTML=`<span>${visible.length} of ${records.length} records</span><span>${visible.filter(r=>r.needs).length} need you</span><span>${visible.filter(r=>r.stage==='Unknown').length} stages unknown</span>`;$('attention-filter').setAttribute('aria-pressed',String(attention));$('all-filter').setAttribute('aria-pressed',String(!attention));$('clear-filters').hidden=!(query||attention||$('status-filter').value||$('stage-filter').value);$('result-count').textContent=`${visible.length} matching records. ${closed.length} complete or cancelled.`;const board=$('board');board.hidden=!current.length&&!!closed.length;if(!records.length){board.hidden=false;board.innerHTML='<div class="empty"><h2>No task records found</h2><p>This snapshot has no records to display. Check the source path and warnings above.</p></div>';}else if(!visible.length){board.hidden=false;board.innerHTML='<div class="empty"><h2>No matching records</h2><p>Try another search or clear the filters.</p><button id="reset" type="button">Reset filters</button></div>';}else{const populated=stages.filter(stage=>current.some(r=>r.stage===stage));board.style.gridTemplateColumns=`repeat(${Math.min(populated.length||1,3)},minmax(0,1fr))`;board.innerHTML=populated.map(stage=>`<section class="column" aria-label="${stage} stage"><div class="column-header"><span class="stage-icon ${stage.toLowerCase()}" aria-hidden="true"></span><h2>${stage==='Unknown'?'Stage unknown':stage}</h2><span class="count">${current.filter(r=>r.stage===stage).length}</span></div>${current.filter(r=>r.stage===stage).sort((a,b)=>Number(b.needs)-Number(a.needs)).map(card).join('')}</section>`).join('');}$('completed').hidden=!closed.length;if(closed.length&&(query||['Complete','Cancelled'].includes($('status-filter').value)||!current.length))$('completed').open=true;$('completed-title').textContent=`Complete or cancelled · ${closed.length}`;$('completed-list').innerHTML=closed.map(r=>`<button type="button" class="completed-row" data-task="${esc(r.id)}" aria-pressed="${selectedTask===r.id}"><span>${esc(r.title)}</span><span class="muted">${esc(r.status)}</span></button>`).join('');renderDetail(byId.get(selectedTask));}
function taskClick(event){const node=event.target.closest('[data-task]');if(node)openDetail(node.dataset.task);if(event.target.id==='reset')resetView();}
function taskKey(event){if(['Enter',' '].includes(event.key)&&event.target.closest('[data-task]')){event.preventDefault();openDetail(event.target.closest('[data-task]').dataset.task);}}
$('navigation').addEventListener('click',event=>{const node=event.target.closest('[data-select]');if(node)selectGoal(node.dataset.select);});
$('global-attention').addEventListener('click',()=>{selected='';$('goal-filter').value='';$('search').value='';$('status-filter').value='';$('stage-filter').value='';attention=true;render();focusMain();});
$('all-filter').addEventListener('click',()=>{attention=false;render();});$('attention-filter').addEventListener('click',()=>{attention=true;render();});
$('search').addEventListener('input',render);['status-filter','stage-filter'].forEach(id=>$(id).addEventListener('change',render));$('goal-filter').addEventListener('change',()=>selectGoal($('goal-filter').value));
$('clear-filters').addEventListener('click',resetView);$('board').addEventListener('click',taskClick);$('board').addEventListener('keydown',taskKey);$('completed-list').addEventListener('click',taskClick);$('completed-list').addEventListener('keydown',taskKey);
$('detail-close').addEventListener('click',closeDetail);document.addEventListener('keydown',event=>{if(event.key==='Escape'&&selectedTask)closeDetail();});$('nav-toggle').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('mobile-open');$('nav-toggle').setAttribute('aria-expanded',String(open));});
$('status-filter').innerHTML='<option value="">Any status</option>'+[...new Set(records.map(r=>r.status))].sort().map(status=>`<option>${esc(status)}</option>`).join('');
$('stage-filter').innerHTML='<option value="">Any stage</option>'+stages.map(stage=>`<option>${stage}</option>`).join('');
$('goal-filter').innerHTML='<option value="">All goals</option>'+records.map(r=>`<option value="${esc(r.id)}">${esc(r.title)}</option>`).join('');
$('snapshot-time').textContent='Generated '+formatTime(snapshot.generatedAt);$('snapshot-time').dateTime=snapshot.generatedAt||'';
$('latest').textContent=snapshot.root?'Source: '+snapshot.root:'Source not configured';
$('source-warnings').hidden=!snapshot.warnings.length;$('warning-title').textContent=`${snapshot.warnings.length} source warning${snapshot.warnings.length===1?'':'s'}`;$('warning-list').innerHTML=snapshot.warnings.map(w=>`<li>${esc(w)}</li>`).join('');
render();
</script>
</body></html>
